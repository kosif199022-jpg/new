services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: new
      POSTGRES_USER: new
      POSTGRES_PASSWORD: new-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U new -d new"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - new-postgres:/var/lib/postgresql/data

volumes:
  new-postgres:
